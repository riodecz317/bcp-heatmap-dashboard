<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Situation Brief — BCP Leadership Update</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');
  :root { --ground: #E7EAF0; --ink: #1B2036; --ink-faint: #8891A3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #05060A; --ink-faint: #7C879C; } }
  :root[data-theme="dark"] { --ground: #05060A; --ink-faint: #7C879C; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font-family: "Inter", sans-serif; display: flex; flex-direction: column; }

  .toolbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; gap: 12px; background: #fff; border-bottom: 1px solid #E2E5EC; }
  .toolbar .app-name { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 14px; color: var(--ink); }
  .toolbar .actions { display: flex; gap: 8px; align-items: center; }
  .btn { font-family: "Inter", sans-serif; font-size: 12.5px; font-weight: 700; border-radius: 7px; padding: 8px 13px; border: 1px solid #E2E5EC; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: #F4F5F8; color: var(--ink); }
  .btn.primary { background: #F97316; color: #fff; border-color: transparent; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .status-msg { font-size: 11.5px; color: var(--ink-faint); }

  .stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: var(--ground); }
  #posterWrap { height: 100%; max-width: 100%; display: flex; }
  #posterWrap svg { height: 100%; width: auto; max-width: 100%; border-radius: 14px; box-shadow: 0 16px 50px rgba(0,0,0,0.35); display: block; }

  @media print {
    body { height: auto; overflow: visible; }
    .toolbar { display: none; }
    .stage { padding: 0; height: 100vh; background: #000; }
    #posterWrap { height: 100vh; }
    #posterWrap svg { border-radius: 0; box-shadow: none; height: 100vh; width: auto; margin: 0 auto; }
    @page { margin: 0; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="app-name">Situation Brief &mdash; BCP Leadership Update</span>
  <div class="actions">
    <span class="status-msg" id="statusMsg"></span>
    <button class="btn" id="pdfBtn" type="button">&#128196; Download PDF</button>
    <button class="btn primary" id="downloadBtn" type="button">&#8681; Download PNG</button>
  </div>
</div>

<div class="stage">
  <div id="posterWrap"></div>
</div>

<script>
  // ---------- Palette: deep charcoal, warm white, muted blue-gray, orange used only for criticality/action ----------
  const PAL = {
    bg: '#12131A', ink: '#F4F2ED', muted: '#8B93A8', faint: '#5E6577',
    accent: '#F97316', accentBright: '#FB923C',
    rule: 'rgba(255,255,255,0.12)', track: 'rgba(255,255,255,0.08)'
  };
  const W = 1600;
  const COL_X = 300, COL_W = 1000; // centered editorial column — generous side margins, not edge-to-edge dashboard fill
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function wrapText(text, maxChars) {
    const words = text.split(' '); const lines = []; let cur = '';
    words.forEach(w => { if ((cur+' '+w).trim().length > maxChars) { lines.push(cur.trim()); cur = w; } else { cur = (cur+' '+w).trim(); } });
    if (cur) lines.push(cur);
    return lines;
  }

  function buildSVG() {
    const parts = [];
    let y = 0;
    const cx = COL_X, cw = COL_W;

    // ---- Masthead ----
    y = 80;
    parts.push(`<circle cx="${cx+5}" cy="${y-6}" r="4.5" fill="${PAL.accent}"/>`);
    parts.push(`<text x="${cx+16}" y="${y}" font-family="Inter" font-weight="700" font-size="14" letter-spacing="2.6" fill="${PAL.faint}">BUSINESS CONTINUITY &#8226; LEADERSHIP UPDATE</text>`);
    parts.push(`<text x="${cx+cw}" y="${y-6}" text-anchor="end" font-family="Inter" font-weight="700" font-size="12.5" letter-spacing="1.4" fill="${PAL.faint}">INTERNAL &#8226; LEADERSHIP ONLY</text>`);
    parts.push(`<text x="${cx+cw}" y="${y+13}" text-anchor="end" font-family="Inter" font-weight="500" font-size="12.5" fill="${PAL.faint}">bcp-heatmap-dashboard &#8226; 2026-08-25</text>`);

    y += 66;
    parts.push(`<text x="${cx}" y="${y}" font-family="Archivo" font-weight="900" font-size="58" fill="${PAL.ink}">Situation Brief</text>`);

    y += 46;
    const headline = 'Critical exposure is concentrated in Metro Manila, increasing the need for shared contingency capacity.';
    const hLines = wrapText(headline, 62);
    hLines.forEach((line, i) => parts.push(`<text x="${cx}" y="${y + i*32}" font-family="Inter" font-weight="500" font-size="24" fill="${PAL.muted}">${esc(line)}</text>`));
    y += (hLines.length - 1) * 32 + 44;

    const rule = () => { parts.push(`<line x1="${cx}" y1="${y}" x2="${cx+cw}" y2="${y}" stroke="${PAL.rule}" stroke-width="1"/>`); y += 50; };
    rule();

    // ---- Hero: 12 ----
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="800" font-size="17" letter-spacing="2" fill="${PAL.accentBright}">CRITICAL &#8212; ACTIVE / UNDISPATCHED</text>`);
    y += 234;
    parts.push(`<text x="${cx}" y="${y}" font-family="Archivo" font-weight="900" font-size="256" fill="${PAL.accent}">12</text>`);
    y += 40;
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="500" font-size="24" fill="${PAL.muted}">of 21 open cases have no assistance in motion yet</text>`);
    y += 50;
    parts.push(`<text x="${cx}" y="${y}" font-family="Archivo" font-weight="800" font-size="26" fill="${PAL.ink}">21</text>`);
    parts.push(`<text x="${cx+34}" y="${y}" font-family="Inter" font-weight="600" font-size="17" fill="${PAL.faint}">open cases</text>`);
    parts.push(`<text x="${cx+230}" y="${y}" font-family="Archivo" font-weight="800" font-size="26" fill="${PAL.ink}">8</text>`);
    parts.push(`<text x="${cx+254}" y="${y}" font-family="Inter" font-weight="600" font-size="17" fill="${PAL.faint}">provinces affected</text>`);
    y += 60;
    rule();

    // ---- Where is the exposure ----
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="800" font-size="16" letter-spacing="2" fill="${PAL.faint}">WHERE IS THE EXPOSURE?</text>`);
    y += 70;
    parts.push(`<text x="${cx}" y="${y}" font-family="Archivo" font-weight="900" font-size="72" fill="${PAL.ink}">15</text>`);
    parts.push(`<text x="${cx+90}" y="${y}" font-family="Inter" font-weight="700" font-size="20" letter-spacing="1" fill="${PAL.muted}">LUZON</text>`);
    y += 30;
    // Nested subset indicator — Metro Manila reads as PART OF Luzon, not a sibling
    const nestTop = y, indent = cx + 46;
    y += 58;
    parts.push(`<text x="${indent}" y="${y}" font-family="Archivo" font-weight="800" font-size="46" fill="${PAL.accentBright}">8</text>`);
    parts.push(`<text x="${indent+56}" y="${y}" font-family="Inter" font-weight="700" font-size="16" letter-spacing="1" fill="${PAL.muted}">METRO MANILA</text>`);
    parts.push(`<line x1="${cx+8}" y1="${nestTop}" x2="${cx+8}" y2="${y-16}" stroke="${PAL.rule}" stroke-width="2"/>`);
    parts.push(`<line x1="${cx+8}" y1="${y-16}" x2="${indent-10}" y2="${y-16}" stroke="${PAL.rule}" stroke-width="2"/>`);
    y += 66;
    [['3','VISAYAS'], ['3','MINDANAO']].forEach(([v,k], i) => {
      const bx = cx + i*220;
      parts.push(`<text x="${bx}" y="${y}" font-family="Archivo" font-weight="800" font-size="40" fill="${PAL.ink}">${v}</text>`);
      parts.push(`<text x="${bx+48}" y="${y}" font-family="Inter" font-weight="700" font-size="15" letter-spacing="1" fill="${PAL.faint}">${k}</text>`);
    });
    y += 58;
    rule();

    // ---- What is driving it ----
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="800" font-size="16" letter-spacing="2" fill="${PAL.faint}">WHAT IS DRIVING IT?</text>`);
    y += 40;
    const hazards = [['Power Outage', 7], ['Typhoon', 6], ['Earthquake', 4], ['Internet Outage', 4]];
    const maxH = Math.max(...hazards.map(h => h[1]));
    hazards.forEach(([label, val]) => {
      parts.push(`<text x="${cx}" y="${y}" font-family="Archivo" font-weight="800" font-size="24" fill="${PAL.ink}">${String(val).padStart(2,'0')}</text>`);
      parts.push(`<text x="${cx+52}" y="${y}" font-family="Inter" font-weight="600" font-size="19" fill="${PAL.muted}">${esc(label)}</text>`);
      const barY = y + 12, barMaxW = cw - 260;
      parts.push(`<rect x="${cx+260}" y="${barY}" width="${barMaxW}" height="6" rx="3" fill="${PAL.track}"/>`);
      parts.push(`<rect x="${cx+260}" y="${barY}" width="${barMaxW*(val/maxH)}" height="6" rx="3" fill="${PAL.accent}" fill-opacity="0.85"/>`);
      y += 50;
    });
    y += 8;
    rule();

    // ---- Executive implication ----
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="800" font-size="16" letter-spacing="2" fill="${PAL.faint}">EXECUTIVE IMPLICATION</text>`);
    y += 38;
    const implication = 'Metro Manila represents 8 of 21 open cases, while Luzon accounts for 15. The concentration suggests a shared contingency response could address multiple exposures at once.';
    const iLines = wrapText(implication, 78);
    iLines.forEach((line, i) => parts.push(`<text x="${cx}" y="${y + i*32}" font-family="Inter" font-weight="500" font-size="21" fill="${PAL.muted}">${esc(line)}</text>`));
    y += (iLines.length - 1) * 32 + 50;
    rule();

    // ---- Recommended action ----
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="800" font-size="16" letter-spacing="2" fill="${PAL.faint}">RECOMMENDED ACTION</text>`);
    y += 46;
    const actionLines = wrapText('Stand up a Metro Manila contingency pool', 30);
    actionLines.forEach((line, i) => parts.push(`<text x="${cx}" y="${y + i*46}" font-family="Archivo" font-weight="900" font-size="38" fill="${PAL.accentBright}">${esc(line.toUpperCase())}</text>`));
    y += (actionLines.length - 1) * 46 + 40;
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="700" font-size="19" fill="${PAL.ink}">Shared generators + backup ISP capacity</text>`);
    y += 32;
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="500" font-size="15.5" font-style="italic" fill="${PAL.faint}">Prioritize shared response capacity where unresolved exposure is most concentrated.</text>`);

    // ---- Footer ----
    y += 56;
    parts.push(`<line x1="${cx}" y1="${y}" x2="${cx+cw}" y2="${y}" stroke="${PAL.rule}" stroke-width="1"/>`);
    y += 30;
    parts.push(`<text x="${cx}" y="${y}" font-family="Inter" font-weight="500" font-size="13" fill="${PAL.faint}">Synthetic demonstration data (confirmed by data-privacy-agent) &#8226; figures pulled directly from bcp_data.json &#8226; no numbers invented.</text>`);
    parts.push(`<text x="${cx+cw}" y="${y}" text-anchor="end" font-family="Inter" font-weight="700" font-size="13" fill="${PAL.faint}">Prepared by graphic-designer-agent</text>`);
    y += 46; // bottom margin

    const H = Math.ceil(y);
    const fontStyle = `<style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');</style>`;
    const bg = `<rect x="0" y="0" width="${W}" height="${H}" fill="${PAL.bg}"/>`;
    return { svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${fontStyle}${bg}${parts.join('')}</svg>`, W, H };
  }

  const built = buildSVG();
  const svgMarkup = built.svg, W_OUT = built.W, H_OUT = built.H;
  document.getElementById('posterWrap').innerHTML = svgMarkup;

  async function rasterizeToCanvas(scale) {
    await document.fonts.ready;
    const blob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    const loaded = new Promise((resolve, reject) => { img.onload = resolve; img.onerror = () => reject(new Error('SVG failed to rasterize')); });
    img.src = url;
    await loaded;
    const canvas = document.createElement('canvas');
    canvas.width = W_OUT * scale; canvas.height = H_OUT * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#12131A'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, W_OUT, H_OUT);
    URL.revokeObjectURL(url);
    return canvas;
  }

  async function canvasToPdfBlob(canvas) {
    const jpegBlob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', 0.92));
    const jpegBytes = new Uint8Array(await jpegBlob.arrayBuffer());
    const w = canvas.width, h = canvas.height;
    const enc = new TextEncoder();
    const chunks = []; let pos = 0; const off = {};
    function push(x) { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); pos += b.length; }
    push('%PDF-1.4\n');
    off[1] = pos; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    off[2] = pos; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    off[3] = pos; push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
    off[4] = pos; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
    push(jpegBytes); push('\nendstream\nendobj\n');
    const content = `q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
    off[5] = pos; push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    const xrefStart = pos;
    let xref = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) xref += String(off[i]).padStart(10,'0') + ' 00000 n \n';
    push(xref);
    push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
    return new Blob(chunks, { type: 'application/pdf' });
  }

  const statusMsg = document.getElementById('statusMsg');
  function setStatus(text, ms) { statusMsg.textContent = text; if (ms) setTimeout(() => { if (statusMsg.textContent === text) statusMsg.textContent = ''; }, ms); }

  async function offer(filename, blob) {
    let downloads;
    try { downloads = await claude.use('downloads'); } catch (e) { downloads = null; }
    if (!downloads) {
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setStatus('Opened in a new tab — save it from there.', 6000);
      return;
    }
    await downloads.save({ filename, data: blob });
    setStatus('Saved.', 4000);
  }

  document.getElementById('downloadBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true; setStatus('Rendering…');
    try {
      const canvas = await rasterizeToCanvas(2);
      const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png'));
      await offer('situation-brief-bcp.png', blob);
    } catch (err) {
      setStatus((err && err.code === 'declined') ? 'Cancelled.' : 'Could not generate the PNG.', 5000);
    } finally { btn.disabled = false; }
  });

  document.getElementById('pdfBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true; setStatus('Rendering…');
    try {
      const canvas = await rasterizeToCanvas(2);
      const blob = await canvasToPdfBlob(canvas);
      await offer('situation-brief-bcp.pdf', blob);
    } catch (err) {
      const code = err && err.code;
      if (code === 'declined') setStatus('Cancelled.', 5000);
      else if (code === 'extension_not_enabled') setStatus('PDF isn\'t available in this view — try Download PNG instead.', 7000);
      else setStatus('Could not generate the PDF.', 5000);
    } finally { btn.disabled = false; }
  });
</script>
</body>
</html>
